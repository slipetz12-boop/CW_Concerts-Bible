<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>City Winery · Concert Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;-webkit-font-smoothing:antialiased}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:#1c1c1e;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.card{
  background:#fff;
  border-radius:10px;
  padding:40px 36px;
  width:100%;max-width:360px;
}
.logo-wrap{text-align:center;margin-bottom:28px}
.logo-name{
  font-family:'Playfair Display',serif;
  font-size:22px;font-weight:700;
  color:#1c1c1e;letter-spacing:-.3px;
}
.logo-sub{
  font-size:12px;color:#8a8a8a;
  margin-top:4px;font-weight:400;
}
.logo-line{
  width:32px;height:2px;
  background:#8B1A2E;
  margin:12px auto 0;
  border-radius:1px;
}
.field{margin-bottom:14px}
label{
  display:block;font-size:11px;font-weight:600;
  color:#6a6a6a;margin-bottom:5px;
  letter-spacing:.03em;text-transform:uppercase;
}
input{
  width:100%;
  padding:10px 12px;
  border:1px solid #dedad5;
  border-radius:5px;
  font-size:13px;font-family:inherit;
  color:#141414;background:#f8f8f7;
  transition:border-color .12s,background .12s;
}
input:focus{outline:none;border-color:#8B1A2E;background:#fff}
.btn{
  width:100%;
  padding:11px;
  background:#8B1A2E;color:#fff;
  border:none;border-radius:5px;
  font-size:13px;font-weight:600;
  font-family:inherit;cursor:pointer;
  transition:background .12s;
  margin-top:6px;
}
.btn:hover{background:#a82036}
.btn:disabled{background:#c0c0c0;cursor:default}
.err{
  font-size:12px;color:#c0392b;
  background:#fdf0ef;border:1px solid #f5c6c2;
  border-radius:4px;padding:9px 12px;
  margin-bottom:14px;display:none;
}
.footer{
  text-align:center;font-size:11px;
  color:#b0b0b0;margin-top:20px;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <div class="logo-name">City Winery</div>
    <div class="logo-sub">Concert Intelligence</div>
    <div class="logo-line"></div>
  </div>
  <div class="err" id="err"></div>
  <div class="field">
    <label>Username</label>
    <input type="text" id="user" placeholder="Enter your username" autocomplete="username" autocapitalize="none">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="pass" placeholder="Enter your password" autocomplete="current-password">
  </div>
  <button class="btn" id="btn" onclick="login()">Sign in</button>
  <div class="footer">Programming &amp; Venues · Internal use only</div>
</div>
<script>
document.getElementById('pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});
document.getElementById('user').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('pass').focus();
});

async function login() {
  const user = document.getElementById('user').value.trim();
  const pass = document.getElementById('pass').value;
  const err  = document.getElementById('err');
  const btn  = document.getElementById('btn');

  if (!user || !pass) {
    showErr('Please enter your username and password.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Signing in…';
  err.style.display = 'none';

  try {
    const res = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass }),
    });
    const data = await res.json();
    if (!res.ok) {
      showErr(data.error || 'Sign in failed. Check your credentials.');
      return;
    }
    // Store token and redirect
    sessionStorage.setItem('cw_token', data.token);
    sessionStorage.setItem('cw_user', data.username);
    window.location.href = '/';
  } catch {
    showErr('Network error. Please try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
}

function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'block';
}

// Already logged in? Redirect
if (sessionStorage.getItem('cw_token')) {
  window.location.href = '/';
}
</script>
</body>
</html>
